name: nadr_mobile
description: Android client for the NADR navigation system.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.9.0
  dio_cookie_manager: ^3.3.0
  cookie_jar: ^4.0.8
  path_provider: ^2.1.5
  flutter_riverpod: ^3.4.3
  geolocator: ^14.0.3
  go_router: ^18.0.1
  maplibre: ^0.3.6
  sensors_plus: ^6.1.2
  flutter_compass: ^0.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/nadr_logo.jpeg
