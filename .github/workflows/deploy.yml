name: Deploy to AWS

on:
  push:
    branches: [ "Production" ]   

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build & Push Backend
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/stellarroute-backend:latest ./backend
        docker push ${{ secrets.DOCKER_USERNAME }}/stellarroute-backend:latest

    - name: Build & Push Frontend
      run: |
        docker build \
          --build-arg VITE_API_URL="https://stellar-route.me/api" \
          -t ${{ secrets.DOCKER_USERNAME }}/stellarroute-frontend:latest ./frontend
        docker push ${{ secrets.DOCKER_USERNAME }}/stellarroute-frontend:latest

    - name: Deploy to EC2 via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          cd ~/stellarroute
          
          # 1. Clear space BEFORE pulling (essential for 8GB EC2 instances)
          docker system prune -f
          
          # 2. Pull and restart
          docker compose pull
          docker compose up -d --remove-orphans
          
          # 3. Health Check (now works because curl is in the Dockerfile)
          echo "Waiting for services to initialize..."
          sleep 15
          if docker exec backend curl --fail http://localhost:8000/health; then
            echo "✅ Deployment Successful"
          else
            echo "❌ Deployment Failed"
            docker compose logs backend
            exit 1
          fi
