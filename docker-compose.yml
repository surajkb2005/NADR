services:
  # 1. The Database
  redis:
    image: redis:alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - stellar-net
    restart: unless-stopped

  # 2. The Python Backend
  backend:
    build: ./backend
    container_name: backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    networks:
      - stellar-net
    restart: unless-stopped

  # 3. The React Frontend
  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=http://localhost:8000
    container_name: frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - stellar-net
    restart: unless-stopped

  # 4. Prometheus
  prometheus:
      image: prom/prometheus:latest
      container_name: prometheus
      volumes:
        - ./prometheus.yml:/etc/prometheus/prometheus.yml
      ports:
        - "9090:9090"
      # REMOVE: extra_hosts is no longer needed since we are using container DNS
      command:
        - '--config.file=/etc/prometheus/prometheus.yml'
        - '--storage.tsdb.path=/prometheus'
      networks:
        - stellar-net  # MUST match the backend network
      restart: unless-stopped

  # 5. Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    networks:
      - stellar-net
    restart: unless-stopped

networks:
  stellar-net:
    driver: bridge