services:
  # 1. The Database
  redis:
    image: redis:alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - stellar-net
    restart: unless-stopped

  # 2. The Python Backend
  backend:
    build: ./backend
    container_name: backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    networks:
      - stellar-net
    restart: unless-stopped

  # 3. The React Frontend
  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=/api
    container_name: frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - stellar-net
    restart: unless-stopped

networks:
  stellar-net:
    driver: bridge